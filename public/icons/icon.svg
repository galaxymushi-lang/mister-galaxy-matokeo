<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Galaxy swirl -->
  <ellipse cx="256" cy="230" rx="140" ry="60" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.4" transform="rotate(-20 256 230)"/>
  <ellipse cx="256" cy="230" rx="110" ry="45" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.5" transform="rotate(15 256 230)"/>
  <ellipse cx="256" cy="230" rx="80" ry="32" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6" transform="rotate(-10 256 230)"/>
  <!-- Stars -->
  <circle cx="160" cy="160" r="3" fill="#818cf8" opacity="0.9"/>
  <circle cx="340" cy="150" r="2.5" fill="#a5b4fc" opacity="0.8"/>
  <circle cx="200" cy="300" r="2" fill="#6366f1" opacity="0.7"/>
  <circle cx="320" cy="290" r="3.5" fill="#818cf8" opacity="0.85"/>
  <circle cx="140" cy="250" r="2" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="370" cy="210" r="2.5" fill="#6366f1" opacity="0.75"/>
  <circle cx="256" cy="140" r="4" fill="#c7d2fe" opacity="0.9"/>
  <!-- Center star glow -->
  <circle cx="256" cy="230" r="12" fill="#818cf8" opacity="0.3"/>
  <circle cx="256" cy="230" r="6" fill="#c7d2fe"/>
  <!-- MG monogram -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="80" fill="white" letter-spacing="-2">MG</text>
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#94a3b8" letter-spacing="6">MATOKEO</text>
</svg>